name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cov]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --cov=unw_planner --cov-report=term
      - name: MCP stdio smoke (no network, no credentials)
        if: matrix.python-version == '3.12'
        env:
          UNW_AUTO_LOGIN: "0"
        run: pytest -q tests/test_mcp_ci.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Wheel install smoke from a non-checkout directory
        run: |
          python -m venv /tmp/unw-wheel-venv
          /tmp/unw-wheel-venv/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/unw-wheel-data
          cd /tmp
          UNW_HOME=/tmp/unw-wheel-data /tmp/unw-wheel-venv/bin/unwplanner --help >/dev/null
          UNW_HOME=/tmp/unw-wheel-data /tmp/unw-wheel-venv/bin/python -c \
            "from unw_planner import config; assert str(config.REPO_ROOT) == '/tmp/unw-wheel-data', config.REPO_ROOT"
