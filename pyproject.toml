[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unw-planner"
version = "0.1.0"
description = "UNW Banner 9 Student Self-Service + degree-audit client foundation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.44",
    "pyotp>=2.9",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
unwplanner = "unw_planner.cli:app"
unw-mcp = "unw_planner.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unw_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
